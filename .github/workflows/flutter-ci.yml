name: Flutter CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          mkdir -p extracted
          unzip -q capcut_clone_step1.zip -d extracted/
          DIR=$(find extracted -name "pubspec.yaml" -exec dirname {} \;)
          if [ -n "$DIR" ]; then
            echo "Found project in $DIR, moving to root..."
            cp -rn "$DIR"/* . || true
            cp -rn "$DIR"/.* . 2>/dev/null || true
          fi
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Project Files
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Android directory missing or incomplete. Recreating Android platform files..."
            flutter create . --platforms=android
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
